name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin-for-vscode/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install VS Code extension dependencies
        working-directory: plugin-for-vscode
        run: npm ci --ignore-scripts

      - name: Install Chromium for payment callback regression tests
        run: npx playwright install --with-deps chromium

      - name: Check versions, catalogs, EconomyOS, and artifacts
        run: npm run check:ci

      - name: Run tests
        run: npm run test:coverage

      - name: Check VS Code extension build
        working-directory: plugin-for-vscode
        run: npm run build

  platform-runtime:
    name: Native runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux X11 runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxtst6 libxrandr2 libxi6 xvfb
      - name: Install dependencies with native addon scripts
        run: npm ci
      - name: Load native desktop and browser runtimes
        run: node scripts/verify-platform-runtime.mjs
